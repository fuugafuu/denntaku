<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Math Lens" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Math Lens</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" data-stage="camera">
    <section id="cameraStage" class="stage camera-stage" aria-label="カメラ">
      <video id="camera" autoplay muted playsinline></video>
      <div class="camera-topbar">
        <button id="chatOpen" class="glass top-icon-button" type="button" aria-label="計算チャットを開く">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18.5 3.5 21v-5.2A8.5 8.5 0 1 1 7 18.5Z"/><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01"/></svg>
        </button>
        <label class="eco-control glass" for="powerSaveSwitch">
          <span class="eco-label">省電力</span>
          <input id="powerSaveSwitch" type="checkbox" />
          <span class="switch-track" aria-hidden="true"><i></i></span>
        </label>
      </div>
      <div id="cameraError" class="camera-error glass hidden"></div>
      <button id="shutter" class="shutter" type="button" aria-label="撮影"><span></span></button>
    </section>

    <section id="photoStage" class="stage photo-stage hidden" aria-label="撮影画像">
      <div id="blurBackdrop" class="blur-backdrop"></div>
      <div id="photoShell" class="photo-shell">
        <img id="capturedPhoto" alt="撮影した画像" draggable="false" />
        <canvas id="selectionCanvas"></canvas>
      </div>
      <button id="backButton" class="round-button back-button glass" type="button" aria-label="戻る">×</button>
      <div id="selectionHint" class="selection-hint glass">計算したい範囲を囲む</div>
    </section>

    <div id="scanFrame" class="scan-frame hidden" aria-hidden="true"><i class="aurora a1"></i><i class="aurora a2"></i><i class="aurora a3"></i><i class="aurora a4"></i></div>
    <div id="scanStatus" class="scan-status glass hidden" role="status">
      <div class="scan-orb"></div>
      <div><strong id="scanTitle">認識中</strong><span id="scanDetail">数式を読み取っています</span></div>
      <div class="progress-track"><i id="scanProgress"></i></div>
    </div>

    <section id="resultSheet" class="result-sheet glass hidden" aria-live="polite">
      <header class="result-header">
        <div><small>BEST MATCH</small><h1 id="resultValue">—</h1></div>
        <button id="resultClose" class="round-button glass" type="button" aria-label="閉じる">×</button>
      </header>
      <div class="recognized-block"><span>認識した式</span><code id="recognizedFormula">—</code></div>

      <div class="translation-row">
        <div><strong>解説を翻訳</strong><small>計算式はそのまま、説明だけ切り替え</small></div>
        <label class="translate-toggle"><span>日本語</span><input id="explainLanguageSwitch" type="checkbox"><b><i></i></b><span>EN</span></label>
      </div>

      <section class="steps-panel"><div class="section-title-row"><h2 id="stepsTitle">計算のしかた</h2><span id="stepCounter"></span></div><ol id="stepsList"></ol></section>
      <section id="alternativesPanel" class="alternatives-panel hidden"><div class="section-title-row"><h2 id="alternativesTitle">別パターン</h2><span id="alternativeCount"></span></div><div id="alternativeCards" class="alternative-cards"></div></section>
      <footer class="result-footer"><button id="alternativesButton" class="glass-action" type="button">別パターンを見る</button></footer>
    </section>

    <section id="chatPanel" class="chat-panel glass hidden" aria-label="計算チャット">
      <header class="chat-header">
        <div><small>LOCAL MATH CHAT</small><h2>計算チャット</h2></div>
        <button id="chatClose" class="round-button glass" type="button" aria-label="チャットを閉じる">×</button>
      </header>
      <div class="chat-translation">
        <span>解説</span>
        <label class="translate-toggle compact"><span>日本語</span><input id="chatLanguageSwitch" type="checkbox"><b><i></i></b><span>EN</span></label>
      </div>
      <div id="chatMessages" class="chat-messages" aria-live="polite">
        <div class="message assistant"><p>式を入力してください。<br>例：<code>2x+5=x+10</code>、<code>(12+8)÷5</code></p></div>
      </div>
      <form id="chatForm" class="chat-composer">
        <textarea id="chatInput" rows="1" inputmode="text" placeholder="計算式を入力…" aria-label="計算式"></textarea>
        <button type="submit" aria-label="送信"><svg viewBox="0 0 24 24"><path d="m4 12 16-8-5.5 16-3-6.5L4 12Z"/><path d="m11.5 13.5 8.5-9.5"/></svg></button>
      </form>
    </section>

    <canvas id="cropCanvas" class="hidden"></canvas>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
