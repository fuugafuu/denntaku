<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#05070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lens">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./lens-v2.css">
  <title>Lens</title>
</head>
<body>
<main id="app" data-scene="camera">
  <section id="cameraScene" class="scene camera-scene">
    <video id="camera" autoplay muted playsinline></video>
    <div class="vignette"></div>
    <header class="topbar">
      <button id="chatOpen" class="icon-btn glass" aria-label="チャットを開く">
        <svg viewBox="0 0 24 24"><path d="M4 5.8A3.8 3.8 0 0 1 7.8 2h8.4A3.8 3.8 0 0 1 20 5.8v5.4a3.8 3.8 0 0 1-3.8 3.8H9l-4.6 4v-4.7A3.8 3.8 0 0 1 4 11.2Z"/><path d="M8 8.5h8M8 11.5h5"/></svg>
      </button>
      <div class="brand glass"><b>Lens</b><span id="engineStatus">LOCAL</span></div>
      <label class="eco glass"><span>省電力</span><input id="ecoSwitch" type="checkbox"><i></i></label>
    </header>

    <div id="cameraError" class="error-card glass hidden"></div>

    <div id="modeDock" class="mode-dock glass" role="tablist">
      <button class="mode active" data-mode="smart"><span>✦</span><b>スマート</b></button>
      <button class="mode" data-mode="math"><span>∑</span><b>解く</b></button>
      <button class="mode" data-mode="text"><span>文</span><b>文字</b></button>
      <button class="mode" data-mode="translate"><span>译</span><b>翻訳</b></button>
      <button class="mode" data-mode="color"><span>◉</span><b>色</b></button>
    </div>

    <div class="capture-row">
      <label class="gallery-btn glass" aria-label="写真を選ぶ"><input id="galleryInput" type="file" accept="image/*"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="m7 15 3-3 2.5 2.5L15 12l3 3"/><circle cx="9" cy="9" r="1.3"/></svg></label>
      <button id="shutter" class="shutter" aria-label="撮影"><i></i></button>
      <button id="settingsOpen" class="icon-btn glass" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7a7 7 0 0 0-.7-1.7l.9-1.9-2.1-2.1-1.9.9a7 7 0 0 0-1.7-.7L10.5 2h-3l-.7 2a7 7 0 0 0-1.7.7l-1.9-.9-2.1 2.1.9 1.9a7 7 0 0 0-.7 1.7L0 10.5v3l2 .7a7 7 0 0 0 .7 1.7l-.9 1.9 2.1 2.1 1.9-.9a7 7 0 0 0 1.7.7l.7 2h3l.7-2a7 7 0 0 0 1.7-.7l1.9.9 2.1-2.1-.9-1.9a7 7 0 0 0 .7-1.7Z" transform="translate(2 1) scale(.83)"/></svg></button>
    </div>
  </section>

  <section id="photoScene" class="scene photo-scene hidden">
    <div id="photoBlur" class="photo-blur"></div>
    <img id="photo" alt="撮影画像" draggable="false">
    <canvas id="selectionCanvas"></canvas>
    <header class="photo-topbar">
      <button id="photoBack" class="icon-btn glass" aria-label="戻る">×</button>
      <div id="photoMode" class="photo-mode glass">スマート</div>
      <button id="newPhoto" class="icon-btn glass" aria-label="撮り直す"><svg viewBox="0 0 24 24"><path d="M4 8a8 8 0 1 1 1.5 9"/><path d="M4 3v5h5"/></svg></button>
    </header>
    <div id="selectionHint" class="selection-hint glass">調べたい範囲を囲む</div>
  </section>

  <div id="aurora" class="aurora-frame hidden"><i></i><i></i><i></i><i></i></div>
  <div id="processing" class="processing glass hidden">
    <div class="processing-orb"></div>
    <div class="processing-copy"><b id="processingTitle">解析中</b><span id="processingDetail">画像を確認しています</span></div>
    <div class="progress"><i id="progressBar"></i></div>
  </div>

  <section id="resultCard" class="result-card glass hidden" aria-live="polite">
    <header class="result-head">
      <div><span id="resultBadge">SMART</span><h1 id="resultTitle">結果</h1><small id="resultMeta"></small></div>
      <button id="resultClose" class="icon-btn inner" aria-label="閉じる">×</button>
    </header>

    <div id="answerBlock" class="answer-block hidden"><strong id="answerValue">—</strong><span id="answerSub"></span></div>

    <div id="editableBlock" class="editable-block hidden">
      <label id="editableLabel" for="editableText">認識した内容</label>
      <textarea id="editableText" rows="2" spellcheck="false"></textarea>
      <div class="edit-actions"><button id="applyEdit">この内容で実行</button><button id="retryRead">もう一度読む</button></div>
    </div>

    <div id="translationBlock" class="translation-block hidden"><small>翻訳</small><div id="translationFrom"></div><div class="arrow">↓</div><div id="translationTo"></div></div>

    <div id="colorBlock" class="color-block hidden"><div id="colorSwatch" class="swatch"></div><div><b id="colorHex">#000000</b><span id="colorRgb">rgb(0,0,0)</span><span id="colorHsl">hsl(0,0%,0%)</span></div></div>

    <section id="stepsSection" class="steps hidden"><header><b>手順</b><span id="stepCount"></span></header><ol id="stepsList"></ol></section>

    <section id="candidateSection" class="candidates hidden"><header><b>候補</b><span id="candidateCount"></span></header><div id="candidateList"></div></section>

    <footer class="result-actions">
      <button id="copyAction">コピー</button>
      <button id="speakAction">読み上げ</button>
      <button id="moreAction">候補</button>
    </footer>
  </section>

  <section id="chatPanel" class="overlay-panel glass hidden">
    <header><div><span>LOCAL TOOL CHAT</span><h2>チャット</h2></div><button id="chatClose" class="icon-btn inner">×</button></header>
    <div id="chatMessages" class="chat-messages"><div class="bubble assistant">計算式を入力すると解きます。<br>例：<code>2x+5=x+10</code></div></div>
    <form id="chatForm" class="chat-form"><textarea id="chatInput" rows="1" placeholder="計算式や文字を入力…"></textarea><button>↑</button></form>
  </section>

  <section id="settingsPanel" class="overlay-panel settings-panel glass hidden">
    <header><div><span>LENS SETTINGS</span><h2>設定</h2></div><button id="settingsClose" class="icon-btn inner">×</button></header>
    <div class="setting-row"><div><b>省電力</b><small>解像度と追加OCRを抑える</small></div><label class="switch"><input id="ecoSwitch2" type="checkbox"><i></i></label></div>
    <div class="setting-row"><div><b>精度優先</b><small>複数OCRを比較する</small></div><label class="switch"><input id="accuracySwitch" type="checkbox" checked><i></i></label></div>
    <div class="setting-row"><div><b>診断表示</b><small>認識エンジンと候補を表示</small></div><label class="switch"><input id="diagnosticSwitch" type="checkbox"><i></i></label></div>
    <div id="storageInfo" class="storage-info">モデルは初回利用時に端末へ保存されます。</div>
  </section>

  <canvas id="cropCanvas" class="hidden"></canvas>
</main>
<script src="./lens-core.js"></script>
<script src="./lens-ocr.js"></script>
<script src="./lens-math.js"></script>
<script src="./lens-ui.js"></script>
<script src="./lens-main.js"></script>
</body>
</html>
